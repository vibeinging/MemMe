openapi: 3.1.0
info:
  title: MemMe REST API
  description: |
    Self-hosted REST API for the MemMe AI memory engine.
    Data is stored in one local SQLite file. Text is sent outside the device only
    when you configure a remote embedding or LLM provider.
  version: 0.1.2
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    url: https://github.com/vibeinging/MemMe

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional. Set via --api-key or MEMME_API_KEY env var.

  schemas:
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
          nullable: true
        app_id:
          type: string
          nullable: true
        run_id:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        importance:
          type: number
          format: float
        access_count:
          type: integer
        immutable:
          type: boolean
        categories:
          type: array
          items:
            type: string
          nullable: true
        memory_type:
          type: string
          nullable: true
        retention:
          type: number
          format: float
        stability:
          type: number
          format: float
        privacy:
          type: string
          enum: [local_only, syncable, encrypted_sync]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryResult:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            score:
              type: number
              format: float
              nullable: true

    IdentifiedChatMessage:
      type: object
      required: [event_id, role, content]
      properties:
        event_id:
          type: string
          description: Stable caller-generated ID used to make retries idempotent.
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        image_url:
          type: string
          nullable: true
          deprecated: true
          description: Not stored yet. Requests containing this field are rejected with 400.
        image_type:
          type: string
          nullable: true
          deprecated: true
          description: Not stored yet. Requests containing this field are rejected with 400.
        timestamp:
          type: string
          format: date-time
          nullable: true

    AppendEventsResult:
      type: object
      properties:
        session_id:
          type: string
        events_appended:
          type: integer
        events_replayed:
          type: integer
        embedding_pending:
          type: integer
          description: Events stored without vectors. Replay the same event IDs to retry backfill.
        total_unprocessed:
          type: integer
        compact_needed:
          type: boolean

    GraphResult:
      type: object
      properties:
        entities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              entity_type:
                type: string
        relations:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              relation_type:
                type: string

    UserStats:
      type: object
      properties:
        user_id:
          type: string
        total_memories:
          type: integer
        total_entities:
          type: integer
        total_relationships:
          type: integer
        unique_agents:
          type: integer
        earliest_memory:
          type: string
          format: date-time
          nullable: true
        latest_memory:
          type: string
          format: date-time
          nullable: true

    ApiOk:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string

paths:
  /health:
    get:
      summary: Health check
      security: []
      tags: [System]
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /diagnose:
    get:
      summary: Diagnose storage, embedding, and LLM connectivity
      description: |
        Runs real provider checks and may consume embedding or LLM quota.
        When MEMME_API_KEY is set, this endpoint requires the Bearer token.
        Only /health remains public.
      tags: [System]
      responses:
        '200':
          description: Diagnostic report
        '401':
          description: Missing or invalid Bearer token

  /v1/config:
    get:
      summary: Get current configuration
      tags: [Config]
      responses:
        '200':
          description: Current config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          has_llm:
                            type: boolean
                          embedding_dims:
                            type: integer

  /v1/config/llm:
    post:
      summary: Configure LLM provider
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key, base_url]
              properties:
                api_key:
                  type: string
                  description: Used in memory only. It is not stored in SQLite.
                model:
                  type: string
                  default: gpt-4.1-nano
                base_url:
                  type: string
                  description: |
                    Full chat-completions endpoint URL. HTTPS and a public destination
                    are required unless the hostname is explicitly listed in
                    MEMME_LLM_ALLOWED_HOSTS by the server operator.
      responses:
        '200':
          description: LLM configured
        '400':
          description: Invalid or unsafe LLM endpoint

  /v1/memories:
    post:
      summary: Add a memory
      tags: [Memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, user_id]
              properties:
                content:
                  type: string
                  description: The text to remember
                user_id:
                  type: string
                agent_id:
                  type: string
                app_id:
                  type: string
                run_id:
                  type: string
                metadata:
                  type: object
                importance:
                  type: number
                  format: float
                  description: 0.0 to 1.0
                immutable:
                  type: boolean
                  default: false
                expiration_date:
                  type: string
                  format: date-time
                categories:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Memory created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Memory'
    delete:
      summary: Delete all memories for a user
      tags: [Memories]
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Memories deleted

  /v1/memories/{id}:
    get:
      summary: Get a memory by ID
      tags: [Memories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory found
        '404':
          description: Memory not found
    put:
      summary: Update a memory
      tags: [Memories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                metadata:
                  type: object
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Memory updated
        '403':
          description: Memory is immutable
        '404':
          description: Memory not found
    delete:
      summary: Delete a memory
      tags: [Memories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory deleted
        '403':
          description: Memory is immutable
        '404':
          description: Memory not found

  /v1/memories/{id}/history:
    get:
      summary: Get change history for a memory
      tags: [Memories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: History records

  /v1/memories/search:
    post:
      summary: Semantic search
      description: Vector similarity search with optional keyword fusion (RRF).
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, user_id]
              properties:
                query:
                  type: string
                  description: Natural language query
                user_id:
                  type: string
                agent_id:
                  type: string
                app_id:
                  type: string
                run_id:
                  type: string
                limit:
                  type: integer
                  default: 10
                threshold:
                  type: number
                  format: float
                  description: Minimum similarity score (0.0 to 1.0)
                keyword_search:
                  type: boolean
                  default: false
                  description: Enable BM25 keyword search + RRF fusion
                fields:
                  type: array
                  items:
                    type: string
                  description: Fields to return (default all)
      responses:
        '200':
          description: Search results ranked by relevance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemoryResult'

  /v1/memories/hybrid-search:
    post:
      summary: Hybrid search (vector + keyword)
      description: Combines vector similarity and BM25 full-text search via Reciprocal Rank Fusion.
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, user_id]
              properties:
                query:
                  type: string
                user_id:
                  type: string
                agent_id:
                  type: string
                app_id:
                  type: string
                run_id:
                  type: string
                limit:
                  type: integer
                  default: 10
                vector_weight:
                  type: number
                  format: double
                fts_weight:
                  type: number
                  format: double
      responses:
        '200':
          description: Hybrid search results

  /v1/memories/list:
    post:
      summary: List memories
      tags: [Memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                agent_id:
                  type: string
                app_id:
                  type: string
                run_id:
                  type: string
                limit:
                  type: integer
                  default: 50
      responses:
        '200':
          description: List of memories

  /v1/memories/export:
    post:
      summary: Export memories
      tags: [Memories]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Filter by user (optional, exports all if not set)
      responses:
        '200':
          description: Memory records only. local_only records are omitted.

  /v1/memories/import:
    post:
      summary: Import memories
      tags: [Memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  content:
                    type: string
                  user_id:
                    type: string
                  metadata:
                    type: object
      responses:
        '200':
          description: Import result with count

  /v1/data/export:
    post:
      summary: Export all data for one user
      description: |
        Exports memories (including local_only records), sessions, events,
        episodes, graph entities and relations, identity traits, sources,
        mutation history, procedures, meditation and recall records,
        memory-entity links, and cross-layer associations. The version 3 format
        includes authoritative lifecycle, correction, scope, and sync fields.
        No list-endpoint pagination limit is applied.
      tags: [Data Safety]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: Full portable user export
        '400':
          description: Missing or empty user_id

  /v1/data/import:
    post:
      summary: Import a full export
      description: |
        Accepts only full export version 3.0 for the target collection. It validates
        owner, session, episode, replacement, and pet scope references before commit.
        All layers and rebuilt indexes are committed in one SQLite transaction; any
        conflict rolls the whole import back. The target must not already contain any
        imported primary-key ID. Admission happens before the JSON body is read, the
        body limit is 32 MiB, imports are limited to 50,000 records and 128 MiB of
        generated embedding vectors, and only one full import runs at a time. Use a
        validated SQLite backup for larger moves or database replacement.
      tags: [Data Safety]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm, export]
              properties:
                confirm:
                  type: string
                  const: import-full-export
                export:
                  type: object
                  description: Full export returned by POST /v1/data/export.
      responses:
        '200':
          description: Import counts for each data layer
        '400':
          description: Invalid confirmation or export
        '413':
          description: Request body exceeds 32 MiB
        '422':
          description: Request body is not valid JSON for this endpoint
        '503':
          description: Another full import is already running
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying

  /v1/events:
    post:
      summary: Append conversation events safely
      description: |
        Stores raw messages immediately. Retrying the same event_id with the same
        payload is safe. Reusing an event_id with different data returns 400. If the
        embedding provider is temporarily unavailable, the raw event remains stored,
        embedding_pending is non-zero, and replaying the same ID retries vector backfill.
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, user_id, messages]
              properties:
                session_id:
                  type: string
                user_id:
                  type: string
                agent_id:
                  type: string
                  description: Stable pet or companion ID. Recommended for pet integrations.
                app_id:
                  type: string
                run_id:
                  type: string
                metadata:
                  type: object
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/IdentifiedChatMessage'
      responses:
        '200':
          description: Append or replay result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AppendEventsResult'
        '400':
          description: Invalid scope, unsupported image input, session ownership conflict, duplicate request IDs, or conflicting event payload
        '422':
          description: Request body is not valid JSON for this endpoint

  /v1/sessions/{session_id}/compact:
    post:
      summary: Compact one session into an episode
      description: Requires an LLM provider. Run this after a conversation ends.
      tags: [Events]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compact result
        '400':
          description: Session not found or LLM is not configured

  /v1/meditations:
    post:
      summary: Extract and reconcile durable memories
      description: Requires an LLM provider.
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                triggered_by:
                  type: string
                  default: rest_api
                since:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Meditation result
        '400':
          description: Invalid request or LLM is not configured

  /v1/backups:
    post:
      summary: Create a SQLite backup
      description: The file is created under the configured MEMME_BACKUP_DIR only.
      tags: [Data Safety]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: Plain filename ending in .db. A safe name is generated when omitted.
      responses:
        '200':
          description: Backup metadata
        '400':
          description: Invalid filename or backup failed

  /v1/backups/restore:
    post:
      summary: Restore a SQLite backup and restart the REST server
      description: |
        Only files inside MEMME_BACKUP_DIR can be restored. The backup is
        checked for SQLite integrity and required MemMe tables before it is
        accepted. Active requests finish, the database is restored, and the
        server starts again on the same address.
      tags: [Data Safety]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, confirm]
              properties:
                filename:
                  type: string
                  description: Plain filename ending in .db inside MEMME_BACKUP_DIR.
                confirm:
                  type: string
                  description: Must be restore:<filename>.
      responses:
        '202':
          description: Restore accepted; the server is restarting
        '400':
          description: Invalid confirmation, filename, or backup database
        '409':
          description: Another restore is already pending

  /v1/replica/status:
    get:
      summary: Get primary and replica status
      tags: [Data Safety]
      responses:
        '200':
          description: Replica status

  /v1/replica/sync:
    post:
      summary: Sync the primary SQLite file to its replica
      tags: [Data Safety]
      responses:
        '200':
          description: Replica sync result

  /v1/graph:
    post:
      summary: Extract knowledge graph
      description: Use LLM to extract entities and relationships from text.
      tags: [Graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, user_id]
              properties:
                text:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Extracted entities and relationships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GraphResult'

  /v1/graph/search:
    post:
      summary: Search knowledge graph
      tags: [Graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, user_id]
              properties:
                query:
                  type: string
                user_id:
                  type: string
                depth:
                  type: integer
                  default: 2
                  description: Graph traversal depth
      responses:
        '200':
          description: Matching entities and relationships

  /v1/recall:
    post:
      summary: Recall memories
      description: Multi-layer unified retrieval with hybrid search.
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, user_id]
              properties:
                query:
                  type: string
                user_id:
                  type: string
                agent_id:
                  type: string
                  description: Stable pet ID. Use this to prevent memories from different pets mixing.
                app_id:
                  type: string
                run_id:
                  type: string
                limit:
                  type: integer
                  default: 10
                threshold:
                  type: number
                  format: float
                fields:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Recall results with recall_id

  /v1/users/{user_id}/stats:
    get:
      summary: User analytics
      tags: [Analytics]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserStats'

  /v1/users/{user_id}:
    delete:
      summary: Delete every data layer for one user
      tags: [Data Safety]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_user_id]
              properties:
                confirm_user_id:
                  type: string
                  description: Must exactly match user_id in the path.
      responses:
        '200':
          description: User data deleted across all data layers
        '400':
          description: Confirmation mismatch or deletion failure

  /v1/users/{user_id}/frequency:
    get:
      summary: Memory creation frequency
      tags: [Analytics]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: granularity
          in: query
          schema:
            type: string
            default: day
            enum: [hour, day, week, month]
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Time-bucketed memory counts

  /v1/users/{user_id}/top-entities:
    get:
      summary: Top entities by relationship count
      tags: [Analytics]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Ranked entities

tags:
  - name: System
    description: Health and status
  - name: Config
    description: Server and LLM configuration
  - name: Memories
    description: CRUD operations on memories
  - name: Search
    description: Semantic and hybrid search
  - name: Events
    description: Durable conversation ingestion and memory lifecycle
  - name: Data Safety
    description: Full data portability, user deletion, SQLite backups, restore, and replica management
  - name: Graph
    description: Knowledge graph operations
  - name: Analytics
    description: User analytics and insights
