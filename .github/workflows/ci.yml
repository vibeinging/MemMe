name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  entry-guards:
    name: Demo and release guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s scripts/tests -v

  local-demo:
    name: First model download (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: demo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run demo with an empty model cache
        env:
          MEMME_DEMO_DIR: ${{ runner.temp }}/memme-demo
        run: bash demos/rest-demo.sh
      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-log-${{ matrix.os }}
          path: ${{ runner.temp }}/memme-demo/server.log
          if-no-files-found: ignore

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # SQLite is the default storage backend — no submodules needed
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy -p memme-core -p memme-embeddings -p memme-llm -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        # SQLite is the default storage backend — no submodules needed
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Download and verify VexDB-Lite SQLite extension
        run: bash scripts/download-vexdb-lite-extension.sh
      - name: Unit tests
        run: cargo test -p memme-core
      - name: Embeddings tests
        run: cargo test -p memme-embeddings
      - name: LLM tests
        run: cargo test -p memme-llm
      - name: Integration tests
        run: cargo test -p memme-core --test integration
      - name: Edge case tests
        run: cargo test -p memme-core --test edge_cases
      - name: Mobile scenario tests
        run: cargo test -p memme-core --test mobile_scenarios
      - name: Stress tests
        run: cargo test -p memme-core --test stress
        timeout-minutes: 10

  build-bindings:
    name: Build bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # SQLite is the default storage backend — no submodules needed
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bindings-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p memme-ffi -p memme-node -p memme-wasm -p memme-server -p memme-mcp
