name: Publish Node.js Package

on:
  push:
    tags:
      - 'v*'
  # Manual re-run for an existing tag (e.g. after a runner or workflow fix).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.2)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-13 (Intel) runners are retired; x86_64 cross-compiles on macos-14.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.settings.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: crates/memme-node
        # Platform packages do not exist until this workflow publishes them.
        # Do not require unresolved optionalDependencies during the build phase.
        run: npm install --ignore-scripts --omit=optional --no-package-lock

      # Cross-compilation setup for aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build native module
        working-directory: crates/memme-node
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.settings.target }}
        run: |
          if [ "${{ matrix.settings.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          npx napi build --platform --release --target ${{ matrix.settings.target }} --cargo-cwd . --js-package-name memme

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/memme-node/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: crates/memme-node
        run: npm install --ignore-scripts --omit=optional --no-package-lock

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/memme-node/artifacts

      - name: Move artifacts
        working-directory: crates/memme-node
        run: npx napi artifacts

      - name: List packages
        working-directory: crates/memme-node
        run: ls -R npm/

      - name: Publish
        working-directory: crates/memme-node
        run: |
          publish_if_needed() {
            local dir="$1"
            local name version
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
              echo "${name}@${version} is already on npm — skipping."
              return 0
            fi
            npm publish "$dir" --access public --provenance
          }
          # Publish platform-specific packages first, then the main package.
          # Versions already on npm are skipped, so re-pushing a release tag
          # cannot fail on republishing.
          for dir in \
            npm/darwin-arm64 \
            npm/darwin-x64 \
            npm/linux-arm64-gnu \
            npm/linux-x64-gnu; do
            publish_if_needed "$dir"
          done
          publish_if_needed "."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
