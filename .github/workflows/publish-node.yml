name: Publish Node.js Package

on:
  push:
    tags:
      - 'v*'
  # Manual re-run for an existing tag (e.g. after a runner or workflow fix).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.2)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Resolve and validate release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag and package versions
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Expected a version tag" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$source_sha" = "$tag_sha" ]] || { echo "Checkout is not the requested tag" >&2; exit 1; }
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const base = 'crates/memme-node';
          const version = process.env.RELEASE_TAG.slice(1);
          const read = dir => JSON.parse(fs.readFileSync(`${base}/${dir}/package.json`, 'utf8'));
          const main = read('.');
          assert.equal(main.name, '@wjmwjmwb/memme');
          assert.equal(main.version, version, 'Main package differs from release tag');
          for (const platform of ['darwin-arm64', 'darwin-x64', 'linux-arm64-gnu', 'linux-x64-gnu']) {
            const pkg = read(`npm/${platform}`);
            assert.equal(pkg.name, `memme-${platform}`);
            assert.equal(pkg.version, version, `${platform} differs from release tag`);
            assert.equal(main.optionalDependencies[pkg.name], version, `${platform} dependency differs`);
          }
          JS
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-13 (Intel) runners are retired; x86_64 cross-compiles on macos-14.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.settings.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: crates/memme-node
        # Platform packages do not exist until this workflow publishes them.
        # Do not require unresolved optionalDependencies during the build phase.
        run: npm install --ignore-scripts --omit=optional --no-package-lock

      # Cross-compilation setup for aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build native module
        working-directory: crates/memme-node
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.settings.target }}
        run: |
          if [ "${{ matrix.settings.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          npx napi build --platform --release --target ${{ matrix.settings.target }} --cargo-cwd . --js-package-name memme

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/memme-node/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [source, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: crates/memme-node
        run: npm install --ignore-scripts --omit=optional --no-package-lock

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/memme-node/artifacts

      - name: Move artifacts
        working-directory: crates/memme-node
        run: npx napi artifacts

      - name: List packages
        working-directory: crates/memme-node
        run: ls -R npm/

      - name: Publish
        working-directory: crates/memme-node
        run: |
          publish_if_needed() {
            local dir="$1"
            local name version
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
              echo "${name}@${version} is already on npm — skipping."
              return 0
            fi
            npm publish "$dir" --access public --provenance
          }
          # Publish platform-specific packages first, then the main package.
          # Versions already on npm are skipped, so re-pushing a release tag
          # cannot fail on republishing.
          for dir in \
            npm/darwin-arm64 \
            npm/darwin-x64 \
            npm/linux-arm64-gnu \
            npm/linux-x64-gnu; do
            publish_if_needed "$dir"
          done
          publish_if_needed "."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
