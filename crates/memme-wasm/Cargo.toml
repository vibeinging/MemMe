[package]
name = "memme-wasm"
version.workspace = true
description = "WebAssembly bindings for the MemMe AI memory engine"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
memme-core = { workspace = true, features = ["bundled"] }
memme-embeddings = { workspace = true, default-features = false }
# Note: DuckDB bundled does not compile to wasm32.
# This crate is for native WASM runtimes (e.g., wasmtime) or
# future DuckDB-WASM integration.
