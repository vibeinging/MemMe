[package]
name = "memme-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core memory engine for MemMe — edge-first AI memory with SQLite single-file storage"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# Webhook delivery (requires HTTP runtime). Off for mobile FFI.
webhooks = ["reqwest", "tokio"]
# ONNX cross-encoder reranker using fastembed for local offline reranking.
onnx-rerank = ["fastembed", "ort", "ort-sys-legacy"]
# ONNX reranker with CoreML acceleration on Apple Silicon.
onnx-rerank-coreml = ["onnx-rerank", "ort/coreml"]
# API-based reranker (Jina/Cohere compatible). Lightweight HTTP client only.
api-rerank = ["reqwest"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing.workspace = true
memme-embeddings = { workspace = true, default-features = false }
memme-llm = { workspace = true }
fastembed = { version = "=3.6.1", optional = true, default-features = false }
ort = { version = "=2.0.0-rc.0", optional = true, default-features = false, features = ["load-dynamic"] }
ort-sys-legacy = { package = "ort-sys", version = "=2.0.0-rc.0", optional = true }
rusqlite = { version = "0.32", features = ["bundled", "vtab", "functions", "load_extension", "backup"] }
tokio = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots", "system-proxy"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
aho-corasick = "1"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
memme-embeddings = { workspace = true, features = ["openai"] }
memme-llm = { workspace = true, features = ["openai"] }
tokio = { workspace = true }

[[test]]
name = "real_llm"

[[example]]
name = "basic"

[[example]]
name = "graph"

[[example]]
name = "search"

[[example]]
name = "session"
