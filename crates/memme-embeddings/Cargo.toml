[package]
name = "memme-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding providers for MemMe — ONNX local inference, OpenAI, and Ollama"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["onnx"]
onnx = ["fastembed", "hf-hub", "ort-legacy", "ort-sys-legacy"]
openai = ["reqwest", "tokio"]
ollama = ["reqwest", "tokio"]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }

# ONNX local inference
fastembed = { version = "=3.6.1", optional = true, default-features = false }
# Prepare the shared Hub cache with relative-redirect support before fastembed's
# legacy downloader reads it. Keep the existing ONNX Runtime ABI unchanged.
hf-hub = { version = "=0.4.3", optional = true, default-features = false, features = ["ureq"] }
ort-legacy = { package = "ort", version = "=2.0.0-rc.0", optional = true, default-features = false, features = ["load-dynamic"] }
ort-sys-legacy = { package = "ort-sys", version = "=2.0.0-rc.0", optional = true }

# Remote API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"], optional = true }

[dev-dependencies]
tempfile = "3"
