[package]
name = "memme-python"
version.workspace = true
description = "Python bindings for the MemMe AI memory engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "memme"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
memme-core = { workspace = true, features = ["webhooks", "api-rerank", "onnx-rerank"] }
memme-embeddings = { workspace = true, features = ["onnx", "openai"] }
memme-llm = { workspace = true, features = ["openai", "ollama", "anthropic", "gemini"] }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
