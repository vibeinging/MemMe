[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "memme"
version = "0.1.0"
description = "Edge-first AI memory engine powered by DuckDB"
license = {text = "Apache-2.0"}
authors = [{name = "MemMe Contributors"}]
requires-python = ">=3.8"
readme = "README.md"
keywords = ["ai", "memory", "llm", "embedding", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/vibeinging/MemMe"
Repository = "https://github.com/vibeinging/MemMe"
Issues = "https://github.com/vibeinging/MemMe/issues"
Changelog = "https://github.com/vibeinging/MemMe/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
