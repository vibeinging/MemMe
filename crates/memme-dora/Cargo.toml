[package]
name = "memme-dora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dora-rs memory node powered by MemMe — give your robot long-term memory"
keywords = ["memory", "ai", "robotics", "dora", "duckdb"]
categories = ["science::robotics", "science::machine-learning"]
rust-version.workspace = true

[lib]
name = "memme_dora"
path = "src/lib.rs"

[[bin]]
name = "memme-dora"
path = "src/main.rs"

[dependencies]
memme-core = { workspace = true, features = ["bundled"] }
memme-embeddings = { workspace = true, features = ["openai"] }
memme-llm = { workspace = true, features = ["openai"] }
dora-node-api = { version = "0.5", features = ["tracing"] }
serde.workspace = true
serde_json.workspace = true
eyre = "0.6"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio.workspace = true
