[package]
name = "memme-node"
version.workspace = true
description = "Node.js bindings for the MemMe AI memory engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive = "2"
memme-core = { workspace = true, features = ["webhooks"] }
memme-embeddings = { workspace = true, features = ["openai"] }
memme-llm = { workspace = true, features = ["openai"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
napi-build = "2"
