[workspace]
members = [
    "crates/memme-core",
    "crates/memme-embeddings",
    "crates/memme-llm",
    "crates/memme-ffi",
    "crates/memme-python",
    "crates/memme-wasm",
    "crates/memme-node",
    "crates/memme-server",
    "crates/memme-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vibeinging/MemMe"
description = "Edge-first AI memory engine with SQLite single-file storage"
keywords = ["memory", "ai", "edge", "sqlite", "embedding"]
categories = ["database", "science"]
rust-version = "1.77"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"

# Internal crates
memme-core = { version = "0.1.0", path = "crates/memme-core", default-features = false }
memme-embeddings = { version = "0.1.0", path = "crates/memme-embeddings", default-features = false }
memme-llm = { version = "0.1.0", path = "crates/memme-llm", default-features = false }

# Release profile: balanced optimization
[profile.release]
lto = "thin"
strip = true

# Mobile-specific profile: aggressive size optimization
[profile.release-mobile]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
